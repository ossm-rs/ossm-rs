name: Build Docs

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the triggering event ref)
        type: string
        default: ''
      upload-artifacts:
        description: Upload docs artifact
        type: boolean
        default: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/docs/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/docs/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml

      - run: pnpm install
        working-directory: apps/docs
      - run: pnpm run build
        working-directory: apps/docs

      - name: Upload docs artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: apps/docs/out
